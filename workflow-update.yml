name: 更新儀表板

on:
  schedule:
    # GitHub 的排程用 UTC 時間，而且尖峰時段可能晚 5 到 30 分鐘才跑
    - cron: "30 23 * * 0-4"   # 台北時間週一到週五 07:30（趕在 08:30 前）
    - cron: "35 13 * * 1-5"   # 台北時間週一到週五 21:35（美國 21:30 數據公布後）
  workflow_dispatch:           # 讓你可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 抓資料並產生網頁
        run: python build.py
      - name: 把新的網頁存回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
